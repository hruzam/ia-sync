# Experimental, manually sourced setup for this workspace only.
# Create the base and both grouped views before sourcing this file.
set-option -t helper-utils-00-tmux mouse on
set-option -t helper-utils-00-tmux history-limit 50000
set-option -t helper-utils-00-tmux--claude mouse on
set-option -t helper-utils-00-tmux--claude history-limit 50000
set-option -t helper-utils-00-tmux--codex mouse on
set-option -t helper-utils-00-tmux--codex history-limit 50000

# Key tables are server-wide, so every custom action checks the workspace group.
# Other sessions retain the default wheel behavior and receive shifted page keys.
bind-key -T root S-PageUp if-shell -F '#{==:#{session_group},helper-utils-00-tmux}' { copy-mode -u } { send-keys S-PageUp }
bind-key -T root S-PageDown if-shell -F '#{&&:#{==:#{session_group},helper-utils-00-tmux},#{pane_in_mode}}' { send-keys -X page-down } { send-keys S-PageDown }
bind-key -T root WheelUpPane if-shell -F '#{==:#{session_group},helper-utils-00-tmux}' { copy-mode -e -t = } { if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e } }
