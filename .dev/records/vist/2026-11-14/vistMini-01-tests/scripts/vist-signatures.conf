# claude: approval prompt. WITNESSED live 2026-11-13 (C08-06, sample-claude, default mode): "Do you want to proceed? > 1. Yes ... Esc to cancel".
claude|needs_approval|Do you want to proceed\?
# claude: generic modal footer, observed live 2026-11-13 on (a) the external-imports trust dialog and (b) the help screen (cartan r1).
# It blocks typing, but it is NOT evidence of an approval request (r1 finding G2).
claude|dialog|Esc to cancel
