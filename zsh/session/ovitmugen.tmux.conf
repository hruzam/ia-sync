# =============================================================================
# ovitmugen.tmux.conf — FRAME server only (tmux -L ovitmugen -f <this file>)
# =============================================================================
# Source: ~/ia-sync/zsh/session/ (deploy.sh spreads) · loaded by ovitmugen.py up
# The agents server (tmux -L default) never reads this file; ~/.tmux.conf never
# reaches the frame. Prefix C-a (majkee 2026-09-24) so C-b passes through to the
# agents in the left pane.
# =============================================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix                    # C-a C-a = literal C-a (shell start-of-line)

set -g status off                       # the left pane already shows the tab bar
set -g mouse on                         # click a pane to focus it
set -g escape-time 10
set -g remain-on-exit on                # left pane survives an inner detach; `ov-up` respawns it
set -g detach-on-destroy on

bind h select-pane -L                   # focus left (agents)
bind l select-pane -R                   # focus right (fixed app)
bind '<' resize-pane -L 5               # move the split left
bind '>' resize-pane -R 5               # move the split right
bind t display-popup -E -w 70% -h 60% 'python3 "$OV_PY" console "#{session_name}"'
bind d detach-client
