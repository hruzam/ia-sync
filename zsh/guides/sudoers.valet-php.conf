# Passwordless sudo for Valet-linux PHP switching
# Install: sudo cp ~/.config/zsh/guides/sudoers.valet-php.conf /etc/sudoers.d/valet-php
# Verify:  sudo visudo -c -f /etc/sudoers.d/valet-php

hruzam ALL=(ALL) NOPASSWD: \
    /usr/bin/systemctl start php74-fpm, \
    /usr/bin/systemctl stop php74-fpm, \
    /usr/bin/systemctl restart php74-fpm, \
    /usr/bin/systemctl start php-fpm, \
    /usr/bin/systemctl stop php-fpm, \
    /usr/bin/systemctl restart php-fpm, \
    /usr/bin/systemctl restart nginx, \
    /usr/bin/systemctl reload nginx
